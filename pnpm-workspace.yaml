packages:
  - 'packages/*'
  - 'examples/*'
  - 'website'
linkWorkspacePackages: deep
strictPeerDependencies: true
ignoreWorkspaceRootCheck: true
dedupePeers: true
allowBuilds:
  esbuild: false
  sharp: false
overrides:
  prosemirror-view: 1.43.0-beta4

minimumReleaseAgeExclude:
  - '@ocavue/eslint-config'
  - prosemirror-view@1.43.0-beta4
