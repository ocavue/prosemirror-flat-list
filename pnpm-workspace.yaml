packages:
  - 'packages/*'
  - 'examples/*'
  - 'website'
linkWorkspacePackages: deep
strictPeerDependencies: true
ignoreWorkspaceRootCheck: true
allowBuilds:
  esbuild: false
  sharp: false
minimumReleaseAgeExclude:
  - starlight-theme-nova@0.12.1
  - prosemirror-splittable@1.1.0
  - '@astrojs/starlight@0.41.3'
